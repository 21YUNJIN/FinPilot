# FinPilot Alembic configuration -- V5 DATA-04 / NFR-02
#
# NOTE: this file MUST stay ASCII-only. Alembic reads alembic.ini with the
# locale codec (cp936/GBK on a zh-CN Windows host), so non-ASCII comments here
# would raise UnicodeDecodeError before any migration runs. Chinese docs live in
# README.md / deploy/README.md / migrations/README.md instead.
#
# Usage (from the repository root):
#   .\.venv\Scripts\python.exe -m alembic upgrade head
#   .\.venv\Scripts\python.exe -m alembic -x db_url="postgresql+psycopg://..." upgrade head
#   .\.venv\Scripts\python.exe -m alembic check           # migration chain vs models.py diff
#   .\.venv\Scripts\python.exe -m alembic downgrade base  # rollback
#
# No credentials are stored here. The URL is resolved by migrations/env.py:
#   1) -x db_url=...   2) DATABASE_URL / .env   3) finpilot.config default
# so the migration chain and the running application always share one source.

[alembic]
# migration script directory (%(here)s = directory of this ini = repository root)
script_location = %(here)s/migrations

# revision file name template: <revision>_<slug>.py  (e.g. 0001_initial.py)
file_template = %%(rev)s_%%(slug)s

# make `python -m alembic` importable from the repo root; migrations/env.py also
# inserts services/api/src into sys.path, so a non-editable install still works
prepend_sys_path = .

# separator for version_locations / prepend_sys_path lists (os default: ';' on
# Windows, ':' on POSIX)
path_separator = os

# encoding used when writing revision files
# output_encoding = utf-8

# Database URL: intentionally empty. migrations/env.py resolves it dynamically
# (the key is kept so ConfigParser lookups never fail).
sqlalchemy.url =


[post_write_hooks]
# Formatters for newly generated revisions (black/ruff are not installed on the
# reference host, so the hooks stay commented out and never block generation)
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME


# Logging: migration SQL and messages go to stderr
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
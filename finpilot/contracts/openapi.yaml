              schema:
                $ref: schemas/error_envelope.json
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 96
        description: task_id：稳定对外 ID；按 owner_user_id 做归属隔离，不存在与无权访问返回同一错误。
  /v1/tasks/{task_id}/messages:

# 融策智能体（FinPilot）HTTP 契约（OpenAPI 3.1）
# 路径集合与 docs/INTERFACES.md 第 4 节逐条一致；由 tests/contracts/test_schemas.py 校验。
# 契约包（contracts）由 D 汇总维护；端点行为由提供者确认（A 发布）。
openapi: 3.1.0
info:
  title: 融策智能体（FinPilot）HTTP 契约
  version: 1.0.0
  summary: V5 第 16 节与 docs/INTERFACES.md 第 4 节的路径集合；写操作要求 operation_id 与 expected_revision。
  description: '所有路径返回统一信封 error_envelope：HTTP 200 不等于业务成功。

    `x-agent-exposed: false` 表示人类专用或运营专用端点，模型工具目录不得暴露；

    `x-required-level` 表示服务端策略等级（GREEN/YELLOW/RED/OPERATOR，NONE 仅用于认证入口）；

    `x-requires-operation-id: true` 表示该写操作必须携带 operation_id 与 expected_revision；

    其余写操作以 `x-idempotency-exempt` 说明其幂等边界。'
  x-policy-version: policy-2026.10
  x-contract-version: '1.0'
  x-publisher: A（端点行为由提供者确认）；contracts 包由 D 汇总维护
servers:
- url: http://127.0.0.1:8000
  description: 本地开发（mock 模式）
tags:
- name: auth
- name: tasks
- name: authorization
- name: operations
- name: cards
- name: subscriptions
- name: wealth
- name: billing
- name: privacy
- name: internal
- name: operator
- name: meta
security:
- sessionBearer: []
paths:
  /v1/auth/sessions:
    post:
      tags:
      - auth
      summary: 创建登录会话
      operationId: create_auth_session
      x-agent-exposed: false
      x-required-level: NONE
      responses:
        '200':
          description: 统一信封：data 字段为下述结构；status=ok 才表示业务成功。
          content:
            application/json:
              schema:
                $ref: schemas/auth_context.json
        default:
          description: 统一错误信封：HTTP 状态码只做参考，业务状态必须读 status 与 error（V1 error_envelope）。
          content:
            application/json:
              schema:
                $ref: schemas/error_envelope.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - user_id
              - password
              - channel
              properties:
                user_id:
                  type: string
                  maxLength: 48
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                channel:
                  enum:
                  - app
                  - im
                  - operator
      x-idempotency-exempt: 认证入口：以会话唯一约束与密码校验实现幂等，不使用 operation_id；失败重试不产生业务效果。
      description: 人类登录入口，模型无权调用。返回 token 与 AuthContext；用户身份只来自服务端会话。
  /v1/auth/totp/enroll:
    post:
      tags:
      - auth
      summary: 注册 TOTP 强验证因子
      operationId: enroll_totp
      x-agent-exposed: false
      x-required-level: NONE
      responses:
        '200':
          description: 统一信封：data 字段为下述结构；status=ok 才表示业务成功。
          content:
            application/json:
              schema:
                $ref: schemas/auth_challenge.json
        default:
          description: 统一错误信封：HTTP 状态码只做参考，业务状态必须读 status 与 error（V1 error_envelope）。
          content:
            application/json:
              schema:
                $ref: schemas/error_envelope.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: []
              properties:
                factor_type:
                  const: totp
      x-idempotency-exempt: 安全因子注册：以当前会话身份与唯一约束保证幂等；密钥只在验证器与服务端之间流转，不进入模型。
      description: 仅认证用户；密钥与验证码永不返回给模型或不写入日志（AUTH-05）。
  /v1/auth/totp/confirm:
    post:
      tags:
      - auth
      summary: 确认 TOTP 因子
      operationId: confirm_totp
      x-agent-exposed: false
      x-required-level: NONE
      responses:
        '200':
          description: 统一信封：data 字段为下述结构；status=ok 才表示业务成功。
        default:
          description: 统一错误信封：HTTP 状态码只做参考，业务状态必须读 status 与 error（V1 error_envelope）。
          content:
            application/json:
              schema:
                $ref: schemas/error_envelope.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - code
              properties:
                code:
                  type: string
                  pattern: ^[0-9]{6}$
                  description: 一次性验证码；不写日志、不回显。
      x-idempotency-exempt: 一次性验证码校验：重复提交同一验证码必须失败，天然不支持幂等键。
      description: 人类验证界面专用；验证码不进入 LLM 上下文。
  /v1/tasks:
    post:
      tags:
      - tasks
      summary: 创建自然语言任务
      operationId: create_task
      x-agent-exposed: true
      x-required-level: GREEN
      responses:
        '200':

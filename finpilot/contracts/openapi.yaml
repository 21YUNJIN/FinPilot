      x-idempotency-exempt: 一次性挑战：成功证明绑定 user_id + scope_hash + challenge_id + expires_at，重放必须失败，因此不接受幂等键。
      description: 人类验证界面专用：120 秒有效、最多 5 次、失败锁定 15 分钟；通过后签发受限授权。

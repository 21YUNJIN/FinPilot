                  minLength: 8
                  maxLength: 128
                reason:
                  type: string
                  maxLength: 255
      x-requires-operation-id: true
      description: 默认自动规划；超限返回 PLANNING_LIMIT，不得声称数学无解。
  /v1/plans/{plan_id}/confirm:

# FinPilot 模块注册表：id、owner、path、provides、depends_on、status。
schema_version: '1.0'
contract_version: '1.0'
policy_version: policy-2026.10
owner_legend:
  A: 交互与卡片：两客户端、意图澄清、确认／强验证交互、结果展示、卡片应用层
  B: 交易内核：身份、账本、预留、授权消费、转账、调度、订单、回执对账与部署
  C: 金融分析与业务：账单、风险测评、产品比较、量化、订阅／商户、AA、数据与统计
  D: 规划与系统验证：DAG 规划、运行时策略、增量恢复、沙箱、审计、评测与集成协调
status_legend:
  planned: 已登记未开工（代码目录尚不存在）
  in_progress: 正在实现（path 必须已存在）
  integrated: 已合入主分支并通过当前轮集成样例
change_protocol: 新增可选字段也要通过契约测试；删除／改名、状态含义改变、金额口径改变与权限变化必须同步列出全部消费者，先做兼容提供方，再迁移消费者，最后删除旧字段（TEAM4 §4.4、GOV-01）。

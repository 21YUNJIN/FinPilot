  sensitive_fields:
  - account_id
  error_codes:
  - OBJECT_NOT_ACCESSIBLE
  - GRANT_REQUIRED
  - GRANT_INVALID
  - POLICY_DENIED
  - VERSION_CONFLICT
  - IDEMPOTENCY_CONFLICT
  - SYSTEM_ERROR
  - CAPABILITY_NOT_SUPPORTED
  implemented_by: services/api/src/finpilot/domains/cards/applications.py
  level_rule: YELLOW：官方小 risk 示例；提额批准为 RED 且需独立运营角色。
- name: card.set_limit
  category: card
  read_write: write
  default_level: YELLOW
  agent_exposed: true
  idempotent: true
  timeout_seconds: 10
  input_schema: https://finpilot.local/schemas/operation_draft.json
  output_schema: https://finpilot.local/schemas/card_control.json
  preconditions:
  - 卡片属于当前用户
  - 调低或增加用户限制；不得申请真实授信
  effects:
  - 写入用户级限额控制
  - 与渠道限制、风控冻结叠加生效
  compensation:
    mode: auto
    description: 用户可自行恢复自己设置的限额；不可解除风控限制。
    tool: null
  sensitive_fields:
  - card_id
  error_codes:
  - OBJECT_NOT_ACCESSIBLE
  - GRANT_REQUIRED
  - GRANT_INVALID
  - POLICY_DENIED
  - VERSION_CONFLICT
  - IDEMPOTENCY_CONFLICT
  - SYSTEM_ERROR
  - FORBIDDEN
  implemented_by: services/api/src/finpilot/domains/cards/applications.py
  level_rule: YELLOW 为调低或增加用户限制；提额批准与重要解锁为 RED，且只能由独立运营角色批准。
- name: card.set_control
  category: card
  read_write: write
  default_level: YELLOW
  agent_exposed: true
  idempotent: true
  timeout_seconds: 10
  input_schema: https://finpilot.local/schemas/operation_draft.json

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finpilot"
version = "1.0.0"
description = "融策智能体（FinPilot）个人银行智能体参考实现 — 可信执行内核、六场景业务与评测框架"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "requests>=2.28",
    "PyYAML>=6.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "jsonschema>=4.21",
]

[tool.setuptools]
package-dir = {"" = "services/api/src"}

[tool.setuptools.packages.find]
where = ["services/api/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/api/src", "services/provider-sandbox"]
addopts = "-ra --strict-markers"
markers = [
    "integration: 需要真实 PostgreSQL 的集成测试",
    "concurrency: 并发与锁语义测试",
    "security: 安全与攻击测试",
    "contract: 契约与 Schema 测试",
    "planning: 规划、DAG 与恢复测试",
    "slow: 耗时较长的评测/演练测试",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["services/api/src/finpilot"]
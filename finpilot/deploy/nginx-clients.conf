# Static host for the two FinPilot clients (compose profile "clients").
# Serves the SPA build with history fallback and reverse-proxies the API so the
# clients can use same-origin relative URLs.
#
# NOT VERIFIED ON THE REFERENCE HOST (no container runtime). Image:
# nginxinc/nginx-unprivileged:1.27-alpine -> listens on 8080 as uid 101.

upstream finpilot_api {
    server api:58000;
    keepalive 8;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers: the clients never need inline scripts from third parties.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /v1/ {
        proxy_pass http://finpilot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /operator/ {
        proxy_pass http://finpilot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /internal/ {
        # provider callbacks: only reachable from the sandbox services on the
        # compose network, never exposed on the host
        proxy_pass http://finpilot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://finpilot_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}